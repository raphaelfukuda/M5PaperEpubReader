[env:m5stack-paper]
platform = platformio/espressif32@7.0.1
board = m5stack-paper
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
    bitbank2/UnzipLIB@1.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DM5EPUB_DEBUG=1

[env:native]
platform = native
test_framework = unity
test_filter = test_native
test_build_src = yes
build_src_filter =
    +<storage/PathUtils.cpp>
    +<epub/HtmlTokenizer.cpp>
    +<epub/HtmlEntityDecoder.cpp>
    +<epub/XmlTokenizer.cpp>
    +<epub/EpubContentDiscovery.cpp>
    +<layout/BasicCssStyle.cpp>
    +<storage/ReadingStateCodec.cpp>
    +<epub/EpubTableOfContents.cpp>
    +<epub/EpubLinks.cpp>
    +<refresh/RefreshPolicy.cpp>
    +<input/PendingReaderActions.cpp>
    +<reader/PrefetchStateMachine.cpp>
    +<display/DisplayRegion.cpp>
    +<display/DirtyRegion.cpp>
    +<storage/PersistPolicy.cpp>
