name: Feature request
description: Suggest a scoped improvement
title: "[Feature]: "
body:
  - type: textarea
    attributes:
      label: Use case
      description: Explain the reader problem this would solve.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Constraints
      description: Consider memory, E-Ink latency, battery and offline operation.
